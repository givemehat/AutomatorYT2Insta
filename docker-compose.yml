version: '3.8'

services:
  app:
    build: .
    container_name: automator_yt2insta
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./storage:/app/storage
      - ./automator.db:/app/automator.db
    environment:
      - PYTHONUNBUFFERED=1
